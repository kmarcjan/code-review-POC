name: Claude Code Review

# Runs Claude Code's local /code-review skill against every pull request
# and posts the findings as inline PR comments. Authenticated with
# CLAUDE_CODE_OAUTH_TOKEN, a long-lived token tied to a Claude Pro/Max
# subscription (generate with `claude setup-token` — no API billing).
# See README.md for one-time setup steps.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
